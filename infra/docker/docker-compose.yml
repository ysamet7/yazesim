# YazeSim — local development stack: PostgreSQL, Redis and a local chain.
#
# Start and stop it through the root scripts (`pnpm infra:up`, `pnpm infra:down`),
# which pass `--env-file infra/docker/.env`. `pnpm bootstrap` creates that file
# with random local credentials; nothing in it is ever committed.
#
# Every port is bound to 127.0.0.1 only: nothing here is reachable from the
# network. Host ports default to 5433, 6380 and 8546 so the stack runs next to
# other projects that use the standard ones. Images are pinned by version and
# digest (a moved tag cannot change what runs); Dependabot proposes upgrades.

name: yazesim

services:
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing - run pnpm bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run pnpm bootstrap}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing - run pnpm bootstrap}
      # Locale-neutral default collation: Turkish ordering is applied explicitly
      # (ICU collations) where needed, so lower('I') stays 'i' for identifiers
      # such as e-mail addresses.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.2-trixie@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD missing - run pnpm bootstrap}
    # noeviction: queue jobs must never be evicted under memory pressure.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"
    ports:
      - 127.0.0.1:${REDIS_PORT:-6380}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  anvil:
    # Local EVM chain (31337) for the test NoR token. Same Foundry release as
    # toolchain.json and CI; Cancun hardfork like Avalanche C-Chain. State
    # persists across restarts so the chain stays consistent with the database.
    image: ghcr.io/foundry-rs/foundry:v1.9.0@sha256:3a392c18f9b16e665e932de159fb6fa9ed972c4b4352f2f76a1a8c7ca9b57d39
    restart: unless-stopped
    entrypoint: [anvil]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=31337
      - --hardfork=cancun
      - --state=/home/foundry/anvil-state.json
      - --state-interval=10
    ports:
      - 127.0.0.1:${ANVIL_PORT:-8546}:8545
    volumes:
      - anvil-data:/home/foundry
    healthcheck:
      test: [CMD, cast, chain-id, --rpc-url, http://127.0.0.1:8545]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  anvil-data:
